<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Robot drives with ultrasonic pings, its camera finds a crack in the wall, and an on-device vision model reports it">
<title>Robot drives with ultrasonic pings, its camera finds a crack in the wall, and an on-device vision model reports it</title><style>
